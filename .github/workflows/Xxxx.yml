name: Build FAP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ufbt
      - run: ufbt
      - uses: actions/upload-artifact@v4
        with:
          name: tagtinker-fap
          path: dist/*.fap
